name: GTA VI Guide quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out guide
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site links, metadata and sitemap
        run: python validate_site.py
      - name: Validate inline JavaScript
        run: python validate_javascript.py
      - name: Validate guide content
        run: python validate_content.py
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium and system dependencies
        run: npx playwright install chromium
      - name: Run mobile browser smoke tests
        run: node test_browser.mjs
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
