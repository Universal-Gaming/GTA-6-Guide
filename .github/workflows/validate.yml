name: Validate GTA VI Guide
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HTML links and sitemap
        run: python validate_site.py
      - name: Validate cross-page content and progress integrations
        run: python validate_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript syntax
        run: python validate_javascript.py
      - name: Install Chromium smoke-test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Test guide in mobile Chromium
        run: node test_browser.mjs
